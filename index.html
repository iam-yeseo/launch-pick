<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>런치Pick</title>
    <style>
        /* 1. 기본 스타일 (Pretendard 폰트) */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 메인 컨테이너 */
        .container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative; /* 설정 버튼 위치 잡기 위해 */
        }

        /* 헤더 영역 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        /* 설정 버튼 (톱니바퀴) */
        .settings-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
        }
        .settings-btn:hover { transform: rotate(90deg); }

        /* 슬롯머신 창 */
        .slot-machine {
            background: #222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #FFD700;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .slot-text {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            white-space: nowrap;
        }

        .blur { filter: blur(3px); opacity: 0.8; }
        .highlight { animation: pop 0.3s ease-in-out; color: #FFD700; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .status-text {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }

        /* 2. 버튼 스타일 (요청하신 컬러 반영) */
        .btn {
            border: none;
            padding: 15px 0;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:active { transform: translateY(2px); box-shadow: none; }

        /* Active 상태 (파란색) */
        .btn-active {
            background-color: #007AFF; /* iOS Blue 느낌 */
        }
        .btn-active:hover { background-color: #0062cc; }

        /* Progress 상태 (회색) */
        .btn-progress {
            background-color: #8E8E93;
            cursor: not-allowed;
        }

        /* Restart 상태 (노란색) */
        .btn-restart {
            background-color: #FFCC00;
            color: #333; /* 노란 배경엔 검은 글씨가 가독성 좋음 */
        }
        .btn-restart:hover { background-color: #ffdb4d; }

        /* 3. 히스토리 영역 */
        .history-container {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
        }

        .history-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #333;
        }
        .history-item:last-child { border-bottom: none; }

        .rank-badge {
            background: #333;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            margin-right: 10px;
            font-weight: bold;
        }

        /* 4. 설정 모달 (옵션 선택) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 85%;
            max-width: 350px;
            max-height: 70vh;
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            text-align: left;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .modal-title { font-weight: bold; font-size: 18px; }
        .close-btn { background:none; border:none; font-size: 24px; cursor: pointer; }

        /* 아코디언 스타일 체크박스 그룹 */
        .category-group { margin-bottom: 15px; }
        .category-header {
            font-weight: bold;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            background: #f1f3f5;
            padding: 8px;
            border-radius: 8px;
        }
        .category-header input { margin-right: 8px; transform: scale(1.2); }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            padding-left: 10px;
        }
        
        .menu-item-check {
            font-size: 13px;
            display: flex;
            align-items: center;
            color: #555;
        }
        .menu-item-check input { margin-right: 5px; }

        .save-btn {
            background: #333;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>런치Pick v1.1</h1>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </header>

        <div class="status-text" id="status-text">오늘 점심 뭐 먹지?</div>
        
        <div class="slot-machine">
            <div class="slot-text" id="slot-display">READY</div>
        </div>

        <button class="btn btn-active" id="action-btn" onclick="handleButtonClick()">메뉴 추천받기</button>

        <div class="history-container">
            <div class="history-title">RECENT PICKS (TOP 3)</div>
            <ul class="history-list" id="history-list">
                <li class="history-item" style="color:#aaa; justify-content:center;">아직 기록이 없습니다.</li>
            </ul>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">메뉴 필터 설정</span>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div id="settings-list">
                </div>
            <button class="save-btn" onclick="saveSettings()">저장하고 닫기</button>
        </div>
    </div>

    <script>
        // === 데이터 및 상태 관리 ===
        const rawData = {
            "한식": ["김치찌개", "된장찌개", "순두부찌개", "제육볶음", "불고기", "비빔밥", "돌솥비빔밥", "김밥", "떡볶이", "냉면", "비빔국수", "잔치국수", "칼국수", "설렁탕", "육개장", "부대찌개", "감자탕", "뚝배기불고기", "콩나물국밥", "삼계탕"],
            "중식": ["짜장면", "짬뽕", "간짜장", "삼선짜장", "볶음밥", "짜장밥", "짬뽕밥", "잡채밥", "유산슬밥", "마파두부밥", "탕수육", "깐풍기", "라조기", "고추잡채", "팔보채", "울면", "기스면", "중화비빔밥", "새우볶음밥", "계란볶음밥"],
            "양식": ["파스타", "크림파스타", "토마토파스타", "오일파스타", "함박스테이크", "돈까스", "오므라이스", "치킨샐러드", "리조또", "필라프", "샌드위치", "파니니", "햄버거", "로스트치킨", "포크커틀릿", "스테이크덮밥", "라자냐", "미트볼", "클럽샌드위치", "그릴드치킨"],
            "일식": ["돈카츠", "규동", "가츠동", "오야코동", "사케동", "카레라이스", "우동", "냉우동", "소바", "자루소바", "라멘", "미소라멘", "탄탄멘", "텐동", "에비동", "사시미정식", "스시", "연어덮밥", "치킨난반", "함박스테이크(일식식)"],
            "분식": ["떡볶이", "순대", "튀김", "김밥", "라볶이", "쫄면", "비빔쫄면", "잔치국수", "어묵국", "어묵", "국물떡볶이", "치즈떡볶이", "즉석떡볶이", "김치볶음밥", "참치김밥", "치즈김밥", "라면", "떡만두국", "만두", "군만두"]
        };

        // 현재 활성화된(체크된) 메뉴 데이터
        let activeData = JSON.parse(JSON.stringify(rawData)); 
        
        // 상태 변수
        let step = 0; // 0: 시작전, 1: 대분류완료, 2: 소분류완료(끝)
        let currentCategory = "";
        let history = []; // 히스토리 저장소

        // DOM 요소
        const slotDisplay = document.getElementById('slot-display');
        const actionBtn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');
        const historyList = document.getElementById('history-list');

        // === 1. 설정(필터) 관련 로직 ===
        
        // 설정창 열 때 체크박스 UI 렌더링
        function openSettings() {
            const container = document.getElementById('settings-list');
            container.innerHTML = ''; // 초기화

            for (const [cat, menus] of Object.entries(rawData)) {
                // 대분류 체크박스 상태 확인 (하나라도 있으면 켜진 걸로 간주하거나, 데이터 기반으로 체크)
                const isCatActive = activeData[cat] && activeData[cat].length > 0;

                let html = `
                <div class="category-group">
                    <div class="category-header">
                        <label>
                            <input type="checkbox" class="cat-chk" data-cat="${cat}" ${isCatActive ? 'checked' : ''} onchange="toggleCategory(this, '${cat}')">
                            ${cat}
                        </label>
                    </div>
                    <div class="menu-grid" id="grid-${cat}">
                `;

                menus.forEach(menu => {
                    // 현재 activeData에 이 메뉴가 있는지 확인
                    const isMenuActive = activeData[cat] && activeData[cat].includes(menu);
                    html += `
                        <label class="menu-item-check">
                            <input type="checkbox" class="menu-chk" data-cat="${cat}" value="${menu}" ${isMenuActive ? 'checked' : ''}>
                            ${menu}
                        </label>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            }

            document.getElementById('settings-modal').style.display = 'flex';
        }

        // 대분류 체크박스 토글 시 하위 메뉴 전체 선택/해제
        function toggleCategory(checkbox, catName) {
            const grid = document.getElementById(`grid-${catName}`);
            const inputs = grid.querySelectorAll('input[type="checkbox"]');
            inputs.forEach(input => input.checked = checkbox.checked);
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        // 설정 저장
        function saveSettings() {
            const newActiveData = {};
            const catGroups = document.querySelectorAll('.category-group');

            catGroups.forEach(group => {
                const catName = group.querySelector('.cat-chk').dataset.cat;
                const menuChks = group.querySelectorAll('.menu-chk:checked');
                
                if (menuChks.length > 0) {
                    newActiveData[catName] = [];
                    menuChks.forEach(chk => {
                        newActiveData[catName].push(chk.value);
                    });
                }
            });

            // 유효성 검사: 아무것도 선택 안 했으면 경고
            if (Object.keys(newActiveData).length === 0) {
                alert("최소한 하나의 메뉴는 선택해야 합니다!");
                return;
            }

            activeData = newActiveData;
            closeSettings();
            resetGame(); // 설정 바뀌면 게임 리셋
            alert("설정이 저장되었습니다!");
        }

        // === 2. 슬롯머신 로직 ===

        function handleButtonClick() {
            if (step === 0) {
                startCategorySlot();
            } else if (step === 1) {
                startMenuSlot();
            } else if (step === 2) {
                resetGame();
            }
        }

        function setButtonState(state, text) {
            actionBtn.className = 'btn'; // 클래스 초기화
            actionBtn.innerText = text;
            actionBtn.disabled = false;

            if (state === 'active') {
                actionBtn.classList.add('btn-active'); // 파란색
            } else if (state === 'progress') {
                actionBtn.classList.add('btn-progress'); // 회색
                actionBtn.disabled = true;
            } else if (state === 'restart') {
                actionBtn.classList.add('btn-restart'); // 노란색
            }
        }

        function spinText(list, duration, callback) {
            setButtonState('progress', '돌아가는 중...');
            slotDisplay.classList.add('blur');
            
            let interval = setInterval(() => {
                slotDisplay.innerText = list[Math.floor(Math.random() * list.length)];
            }, 50);

            setTimeout(() => {
                clearInterval(interval);
                const finalChoice = list[Math.floor(Math.random() * list.length)];
                slotDisplay.innerText = finalChoice;
                slotDisplay.classList.remove('blur');
                slotDisplay.classList.add('highlight');
                setTimeout(() => slotDisplay.classList.remove('highlight'), 300);
                callback(finalChoice);
            }, duration);
        }

        function startCategorySlot() {
            const categories = Object.keys(activeData);
            if(categories.length === 0) {
                alert("선택된 카테고리가 없습니다. 설정을 확인해주세요.");
                return;
            }

            statusText.innerText = "어떤 종류를 먹을까?";
            spinText(categories, 1500, (result) => {
                currentCategory = result;
                statusText.innerText = `선택: ${currentCategory}`;
                setButtonState('active', '메뉴 뽑기 >'); // 파란색
                step = 1;
            });
        }

        function startMenuSlot() {
            const menus = activeData[currentCategory];
            statusText.innerText = "두구두구...";
            
            spinText(menus, 2000, (result) => {
                statusText.innerText = "오늘의 점심 메뉴 확정!";
                updateHistory(currentCategory, result);
                
                setButtonState('restart', '다시 하기 ↺'); // 노란색
                step = 2;
            });
        }

        function resetGame() {
            step = 0;
            currentCategory = "";
            slotDisplay.innerText = "READY";
            statusText.innerText = "오늘 점심 뭐 먹지?";
            setButtonState('active', '메뉴 추천받기'); // 파란색
        }

        // === 3. 히스토리 로직 ===
        function updateHistory(cat, menu) {
            // 새 기록 추가 (앞에 추가)
            history.unshift({ cat, menu });
            
            // 3개까지만 유지
            if (history.length > 3) {
                history.pop();
            }

            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) return;
            
            historyList.innerHTML = '';
            history.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <span class="rank-badge">${index + 1}</span>
                    <span>${item.cat} > <strong>${item.menu}</strong></span>
                `;
                historyList.appendChild(li);
            });
        }

    </script>
</body>
</html>
